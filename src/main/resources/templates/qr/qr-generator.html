<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator - PetexSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body
    class="min-h-screen flex flex-col bg-[#0b0f19] text-gray-100 selection:bg-blue-600 selection:text-white"
  >
    <!-- Header / Navbar (Có nút Back) -->
    <header
      class="w-full max-w-3xl mx-auto px-6 py-8 flex items-center justify-between"
    >
      <a
        href="/"
        class="flex items-center space-x-2 text-gray-400 hover:text-white transition-colors"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10 19l-7-7m0 0l7-7m-7 7h18"
          ></path>
        </svg>
        <span class="font-medium text-sm">Back to Utilities</span>
      </a>
      <div class="font-bold tracking-tight text-white text-lg">PetexSpace</div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-3xl mx-auto px-6 py-4 flex-grow">
      <div class="mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-3">
          Create a QR Code
        </h1>
        <p class="text-gray-400 text-sm md:text-base">
          Enter your text, URL, or data below to generate a custom QR code
          instantly.
        </p>
      </div>

      <!-- Box bọc Form và Kết quả -->
      <div
        class="bg-[#121722] border border-gray-800/80 rounded-2xl p-6 md:p-8 shadow-xl"
      >
        <!-- Khu vực nhập liệu -->
        <div class="mb-6">
          <label
            for="qr-input"
            class="block text-sm font-medium text-gray-300 mb-2"
            >Your data (URL or Text)</label
          >
          <textarea
            id="qr-input"
            rows="3"
            placeholder="https://github.com/..."
            class="w-full bg-[#161c29] text-white placeholder-gray-600 text-sm rounded-xl p-4 border border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition-all resize-none"
          ></textarea>
        </div>

        <!-- Nút bấm -->
        <button
          id="generate-btn"
          class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-600/20 active:scale-[0.98]"
        >
          Generate QR Code
        </button>

        <!-- Khu vực hiển thị kết quả (Mặc định ẩn) -->
        <div
          id="qr-result-box"
          class="hidden mt-8 flex flex-col items-center justify-center pt-8 border-t border-gray-800"
        >
          <div class="bg-white p-3 rounded-xl mb-4 shadow-lg qr-animation">
            <img
              id="qr-image"
              src=""
              alt="Generated QR Code"
              class="w-48 h-48 object-contain"
            />
          </div>
          <a
            id="download-btn"
            href="#"
            download="PetexSpace-QR.png"
            target="_blank"
            class="flex items-center space-x-2 text-sm text-blue-400 hover:text-blue-300 transition-colors"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
              ></path>
            </svg>
            <span>Download Image</span>
          </a>
        </div>
      </div>
    </main>

    <script th:src="@{/js/qr-generator.js}"></script>
  </body>
</html>
